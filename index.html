<style>
:root{color-scheme:dark;--red:#ff6254;--bg:#050303}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#180707 0%,#090404 52%,#050303 80%);color:var(--red)}
main{width:100vw;height:100svh;min-height:420px;display:grid;place-items:center;position:relative;padding:12px}
.heart-stage{width:min(100%,700px);height:min(88svh,700px);display:grid;place-items:center}
svg{width:100%;height:100%;overflow:visible}
.word{text-anchor:middle;dominant-baseline:middle;font-family:"Noto Sans","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Hebrew","Noto Sans Thai","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Armenian","Noto Sans Ethiopic","Noto Sans Georgian","Noto Sans Khmer","Noto Sans Lao","Noto Sans Myanmar","Noto Sans Sinhala",sans-serif;font-size:7.6px;font-weight:500;letter-spacing:0;fill:var(--red);opacity:0}
.word.visible{animation:appear .38s ease-out forwards}
@keyframes appear{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
.replay{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #54201c;background:#100706;color:#e77a6d;border-radius:30px;padding:9px 15px;font:9px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.68;cursor:pointer}
.replay:hover{opacity:1;border-color:#b94235}
@media(max-width:520px){main{padding:5px}.heart-stage{width:100%;height:82svh}.word{font-size:6.8px}.replay{bottom:14px}}
@media(prefers-reduced-motion:reduce){.word.visible{animation:none;opacity:1}}
</style>
</head>
<body>

  <div class="heart-stage"><svg id="heart" viewBox="0 0 600 620" role="img" aria-label="A symmetrical heart formed from translations of I love you"></svg></div>
  <button class="replay" id="replay" type="button">↻ &nbsp; replay</button>
</main>
<script>
const phrases = [

["Aloha wau iā ʻoe","Hawaiian"],["אני אוהב אותך","Hebrew"],["मैं आपसे प्यार करती हूँ","Hindi"],["Kuv hlub koj","Hmong"],

["Aku mencintaimu","Indonesian"],["Ti amo","Italian"],["愛してます","Japanese"],["Мен сені жақсы көремін","Kazakh"],
["ខ្ញុំស្រលាញ់អ្នក","Khmer"],["Ndagukunda","Kinyarwanda"],["사랑해요","Korean"],["Ez hej te dikim","Kurdish"],
["ຂ້ອຍຮັກເຈົ້າ","Lao"],["Te amo","Latin"],["Es mīlu Tevi","Latvian"],["Aš tave myliu","Lithuanian"],

["Kocham cię","Polish"],["Te amo","Portuguese"],["ਮੈਂ ਤੁਹਾਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","Punjabi"],["Sin jaalladha","Oromo"],
["Kuyaykim","Quechua"],["Te iubesc","Romanian"],["Я тебя люблю","Russian"],["Oute alofa ia oe","Samoan"],
["Ke a go rata","Sepedi"],["Волим те","Serbian"],["Kea u rata","Sesotho"],["Ľúbim ťa","Slovak"],
["Ljubim te","Slovenian"],["Waan ku jeclahay","Somali"],["Te amo","Spanish"],["Nakupenda","Swahili"],
["Jag älskar dig","Swedish"],["Ua here vau ia oe","Tahitian"],["நான் உன்னை நேசிக்கிறேன்","Tamil"],["నేను నిన్ను ప్రేమిస్తున్నాను","Telugu"],
["ฉันรักคุณ","Thai"],["ང་ཁྱོད་ལ་དགའ།","Tibetan"],["ʻOku ou 'ofa au 'ia koe","Tongan"],["Ndza ku rhandza","Tsonga"],
["Seni seviyorum","Turkish"],["я тебе люблю","Ukrainian"],["Men sizni sevaman","Uzbek"],["Tôi yêu bạn","Vietnamese"],

["Ngiyakuthanda","Zulu"],["মই তোমাক ভাল পাওঁ","Assamese"],["हम तोहसे प्यार करेनी","Bhojpuri"],["Эпĕ сана юрататăп","Chuvash"],
["ང་ཁྱོད་ལུ་ག་དགའི་ཡོད","Dzongkha"],["Eg elski teg","Faroese"],["Ik hâld fan dy","Frisian"],["Asavakkit","Greenlandic"],
["હું તને પ્રેમ કરું છું","Gujarati"],["ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","Kannada"],["तुजो मोग म्हाका जाय","Konkani"],["ഞാൻ നിന്നെ പ്രേമിക്കുന്നു","Malayalam"],
["मी तुझ्यावर प्रेम करतो","Marathi"],["ମୁଁ ତୁମକୁ ଭଲ ପାଉଛି","Odia"],["مان توکي پيار ڪندو آهيان","Sindhi"],["මම ඔයාට ආදරෙයි","Sinhala"],
["Abdi bogoh ka anjeun","Sundanese"],["Volim te","Croatian"],["Те сакам","Macedonian"],["Jau t\'am","Romansh"]
,["Сэ шІу усэлъэгъу","Adyghe"],["Txin yaxtakuq","Aleut"],["Ich hàbb dir lïab","Alsatian"],["Мен сени сӱӱп jадым","Altay"],["T'aimo","Aragonese"],["Biixoo3é3en","Arapaho"],["Ti voi","Aromanian"],["Quiérote","Asturian"],["Ki micta sakihitin","Atikamekw"],["Titiyang tresna sareng ragane","Balinese"],["M'bi fe","Bambara"],["мин һине яратам","Bashkir"],["I liab di","Bavarian"],["Nalikutemwa","Bemba"],["Namumùtan taka","Bikol"],["Bong nawa ta gè","Blaan"],["Karout a ran ac'hanout","Breton"],["Nta amabo","Cape Verdean Creole"],["Go-nóhkwa’","Cayuga"],["Oupus oku diya","Central Dusun"],["Ta ama yo cuntigo","Chabacano"],["Ai ranam dai","Cham (Western)"],["Hu guiaya hao","Chamorro"],["Суна хьо дукха веза","Chechen"],["ᎬᎨᏳᎢ","Cherokee"],["Nemehotȧtse","Cheyenne"],["من دوستت دارم","Dari"],["Ina son ki","Hausa"],["Kulo tresno kaliyan njenengan","Javanese"],["Мен сени сүйөм","Kyrgyz"]
];

const svg=document.getElementById("heart");
const NS="http://www.w3.org/2000/svg";
let timers=[];
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

function getRows(){
  const scale=232,cx=300,cy=306,rows=[];
  const f=(x,y)=>(x*x+y*y-1)**3-x*x*y*y*y;
  const step=0.026, samples=2400, lo=-1.18, hi=1.18, dx=(hi-lo)/samples;
  for(let y=0.985;y>=-1.005;y-=step){
    const roots=[];
    let x0=lo,v0=f(x0,y);
    for(let n=1;n<=samples;n++){
      const x1=lo+n*dx,v1=f(x1,y);
      if((v0<0&&v1>=0)||(v0>=0&&v1<0)){
        let l=x0,h=x1,fl=v0;
        for(let k=0;k<18;k++){
          const m=(l+h)/2,fm=f(m,y);
          if((fl<0&&fm<0)||(fl>=0&&fm>=0)){l=m;fl=fm}else h=m;
        }
        roots.push((l+h)/2);
      }
      x0=x1;v0=v1;
    }
    for(let i=0;i+1<roots.length;i+=2){
      const left=cx+roots[i]*scale+2.2;
      const right=cx+roots[i+1]*scale-2.2;
      if(right-left>10)rows.push({y:cy-y*scale,left,right});
    }
  }
  return rows;
}
function familyFor(s){
  if(/[\u0600-\u06ff\u0750-\u077f]/.test(s))return '"Noto Sans Arabic",sans-serif';
  if(/[\u0900-\u097f]/.test(s))return '"Noto Sans Devanagari",sans-serif';
  if(/[\u0980-\u09ff]/.test(s))return '"Noto Sans Bengali",sans-serif';
  if(/[\u0c00-\u0c7f]/.test(s))return '"Noto Sans Telugu",sans-serif';
  if(/[\u0b80-\u0bff]/.test(s))return '"Noto Sans Tamil",sans-serif';
  if(/[\u0e00-\u0e7f]/.test(s))return '"Noto Sans Thai",sans-serif';
  if(/[\u3040-\u30ff]/.test(s))return '"Noto Sans JP",sans-serif';
  if(/[\uac00-\ud7af]/.test(s))return '"Noto Sans KR",sans-serif';
  if(/[\u4e00-\u9fff]/.test(s))return '"Noto Sans SC",sans-serif';
  if(/[\u0590-\u05ff]/.test(s))return '"Noto Sans Hebrew",sans-serif';
  if(/[\u0530-\u058f]/.test(s))return '"Noto Sans Armenian",sans-serif';
  if(/[\u10a0-\u10ff]/.test(s))return '"Noto Sans Georgian",sans-serif';
  if(/[\u1200-\u137f]/.test(s))return '"Noto Sans Ethiopic",sans-serif';
  if(/[\u1780-\u17ff]/.test(s))return '"Noto Sans Khmer",sans-serif';
  if(/[\u0e80-\u0eff]/.test(s))return '"Noto Sans Lao",sans-serif';
  if(/[\u1000-\u109f]/.test(s))return '"Noto Sans Myanmar",sans-serif';
  if(/[\u0d00-\u0d7f]/.test(s))return '"Noto Sans Malayalam",sans-serif';
  if(/[\u0c80-\u0cff]/.test(s))return '"Noto Sans Kannada",sans-serif';
  if(/[\u0a00-\u0a7f]/.test(s))return '"Noto Sans Gurmukhi",sans-serif';
  if(/[\u0b00-\u0b7f]/.test(s))return '"Noto Sans Oriya",sans-serif';
  if(/[\u0d80-\u0dff]/.test(s))return '"Noto Sans Sinhala",sans-serif';
  return '"Noto Sans",sans-serif';
}
function measure(text,size,family){
  ctx.font='500 '+size+'px '+family;
  return ctx.measureText(text).width;
}
function layout(){
  timers.forEach(clearTimeout);timers=[];
  svg.replaceChildren();
  const mobile=matchMedia('(max-width:520px)').matches;
  const base=mobile?6.2:7.0;
  const min=mobile?3.7:4.1;
  const gap=mobile?5.4:6.2;
  const remaining=phrases.map(([phrase,language],index)=>({phrase,language,index,family:familyFor(phrase)}));
  const placements=[];
  const rows=getRows();
  for(const row of rows){
    if(!remaining.length)break;
    const rowWidth=row.right-row.left;
    let cursor=row.left;
    const placed=[];
    while(remaining.length){
      const room=row.right-cursor-(placed.length?gap:0);
      if(room<8)break;
      let pick=-1,pickWidth=-1,pickSize=base;
      // Prefer the widest phrase that fits. This reserves short phrases for
      // the narrow shoulders and the pointed bottom of the mathematical heart.
      for(let i=0;i<remaining.length;i++){
        const w=measure(remaining[i].phrase,base,remaining[i].family);
        if(w<=room && w>pickWidth){pick=i;pickWidth=w;pickSize=base;}
      }
      if(pick<0 && placed.length===0 && rowWidth>=12){
        let best=-1,bestSize=0,bestWidth=0;
        for(let i=0;i<remaining.length;i++){
          const natural=measure(remaining[i].phrase,base,remaining[i].family);
          const size=Math.min(base,base*(rowWidth-2)/natural);
          if(size>=min && size>bestSize){
            best=i;bestSize=size;bestWidth=measure(remaining[i].phrase,size,remaining[i].family);
          }
        }
        if(best>=0){pick=best;pickSize=bestSize;pickWidth=bestWidth;}
      }
      if(pick<0)break;
      const item=remaining.splice(pick,1)[0];
      placed.push({item,width:pickWidth,size:pickSize});
      cursor+=pickWidth+(placed.length>1?gap:0);
    }
    if(!placed.length)continue;
    const total=placed.reduce((n,p)=>n+p.width,0)+gap*(placed.length-1);
    let x=(row.left+row.right-total)/2;
    for(const p of placed){
      const el=document.createElementNS(NS,'text');
      el.setAttribute('class','word');
      el.setAttribute('x',(x+p.width/2).toFixed(2));
      el.setAttribute('y',row.y.toFixed(2));
      el.setAttribute('font-family',p.item.family);
      el.style.fontSize=p.size+'px';
      el.textContent=p.item.phrase;
      svg.appendChild(el);
      placements.push(el);
      x+=p.width+gap;
    }
  }
  // All text stays inside its own equation-derived scanline. Never force
  // leftovers into occupied space; report the exact count for verification.
  svg.dataset.placed=String(placements.length);
  svg.dataset.total=String(phrases.length);
  if(remaining.length)console.warn('Phrases not placed without violating spacing:',remaining.map(p=>p.language));
  placements.forEach((el,i)=>{
    timers.push(setTimeout(()=>el.classList.add('visible'),i*12));
  });
}
function render(){layout();}
document.getElementById('replay').addEventListener('click',render);
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,160)});

</script>

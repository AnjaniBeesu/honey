<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050303">
<meta name="description" content="I love you, in every language.">
<title>for you ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500&family=Noto+Sans+Devanagari:wght@500&family=Noto+Sans+JP:wght@500&family=Noto+Sans+KR:wght@500&family=Noto+Sans+SC:wght@500&family=Noto+Sans+Telugu:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#ff604f;--bg:#050303}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#160707 0%,#090404 48%,#050303 78%);color:var(--red)}
main{width:min(100vw,760px);height:100svh;min-height:420px;display:grid;place-items:center;position:relative;padding:20px}
.heart-stage{width:min(100%,620px);aspect-ratio:1/1.04;display:grid;place-items:center}
svg{width:100%;height:100%;overflow:visible}
.word{font-family:'Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Arabic',Arial,sans-serif;font-size:10.2px;font-weight:600;fill:var(--red);opacity:0;filter:drop-shadow(0 0 3px #ff493b45)}
.word.visible{animation:appear .32s ease-out forwards}
@keyframes appear{from{opacity:0;filter:blur(2px);transform:translateY(2px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.replay{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #54201c;background:#100706;color:#e77a6d;border-radius:30px;padding:9px 15px;font:9px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.68;cursor:pointer}
.replay:hover{opacity:1;border-color:#b94235}
@media(max-width:520px){main{padding:10px}.heart-stage{width:112%;max-width:none}.word{font-size:10px}.replay{bottom:18px}}
@media(prefers-reduced-motion:reduce){.word.visible{animation:none;opacity:1}}
</style>
</head>
<body>
<main>
  <div class="heart-stage">
    <svg id="heart" viewBox="0 0 600 620" role="img" aria-label="A heart filled with I love you in many languages"></svg>
  </div>
  <button class="replay" id="replay" type="button">↻ &nbsp; replay</button>
</main>
<script>
const phrases = [
['I love you','en'],['You mean the world to me','en'],
['मैं तुमसे प्यार करता हूँ','hi'],['तुम मेरे लिए बहुत खास हो','hi'],
['నిన్ను ప్రేమిస్తున్నాను','te'],['నువ్వు నాకు ఎంతో ప్రత్యేకం','te'],
['Ich liebe dich','de'],['Du bedeutest mir alles','de'],
['사랑해','ko'],['너는 나에게 소중해','ko'],
['愛してる','ja'],['君は私の大切な人','ja'],
['我爱你','zh'],['你对我来说很重要','zh'],
['Te amo','es'],['Eres mi persona favorita','es'],
['Je t’aime','fr'],['Tu comptes énormément pour moi','fr'],
['Ti amo','it'],['Sei speciale per me','it'],
['Я тебя люблю','ru'],['Ты очень дорог мне','ru'],
['أحبك','ar'],['أنت تعني لي الكثير','ar'],
['Eu te amo','pt'],['Você é muito especial','pt'],
['Mahal kita','tl'],['Napakahalaga mo sa akin','tl'],
['Seni seviyorum','tr'],['Benim için çok özelsin','tr'],
['Σ’ αγαπώ','el'],['Είσαι ξεχωριστός για μένα','el'],
['Kocham cię','pl'],['Jesteś dla mnie wszystkim','pl'],
['Ik hou van jou','nl'],['Je bent bijzonder voor mij','nl'],
['Jeg elsker dig','da'],['Du betyder alverden for mig','da'],
['Jag älskar dig','sv'],['Du är allt för mig','sv'],
['Nakupenda','sw'],['Wewe ni wa thamani kwangu','sw'],
['Volim te','hr'],['Poseban si mi','hr'],
['நான் உன்னை காதலிக்கிறேன்','ta'],['நீ எனக்கு மிகவும் முக்கியம்','ta'],
['আমি তোমাকে ভালোবাসি','bn'],['তুমি আমার কাছে খুব বিশেষ','bn'],
['હું તને પ્રેમ કરું છું','gu'],['તું મારા માટે ખાસ છે','gu'],
['Te quiero','es'],['Mi corazón está contigo','es'],
['Je t’adore','fr'],['Mon cœur est à toi','fr'],
['Ich hab dich lieb','de'],['Du bist mein Lieblingsmensch','de'],
['사랑합니다','ko'],['항상 네 곁에 있을게','ko'],
['愛してるよ','ja'],['ずっと大切にするよ','ja'],
['我愛你','zh'],['你是我心中的寶藏','zh'],
['Я люблю тебя','ru'],['Ты делаешь мой мир лучше','ru'],
['Ti voglio bene','it'],['Con te è tutto più bello','it'],
['أحبك كثيراً','ar'],['قلبي معك دائماً','ar'],
['நீ என் மகிழ்ச்சி','ta'],['నీతో ఉంటే ఆనందంగా ఉంటుంది','te'],
['너와 함께라서 행복해','ko'],['君といると幸せ','ja'],
['Eres mi alegría','es'],['Tu es mon bonheur','fr'],
['Du bist mein Glück','de'],['Sei la mia felicità','it']
];
const svg=document.getElementById('heart');
const ns='http://www.w3.org/2000/svg';
let timers=[];
let phraseCursor=0;
const sampleCanvas=document.createElement('canvas');
const ctx=sampleCanvas.getContext('2d');
const font='600 10.2px "Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Arabic",Arial,sans-serif';
ctx.font=font;

// Sample a mathematically defined heart outline, then calculate the exact
// left/right edge at every text baseline. No visible guides or coordinate marks.
function heartRows(){
  const outline=[];
  const scale=13.0, cx=300, cy=310;
  for(let i=0;i<=1200;i++){
    const t=(i/1200)*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    outline.push({x:cx+scale*x,y:cy-scale*y});
  }
  const minY=Math.min(...outline.map(p=>p.y));
  const maxY=Math.max(...outline.map(p=>p.y));
  const rows=[];
  for(let scanY=minY+7;scanY<maxY-5;scanY+=15.5){
    const crossings=[];
    for(let i=0;i<outline.length-1;i++){
      const p1=outline[i],p2=outline[i+1];
      if((p1.y<=scanY && p2.y>scanY)||(p2.y<=scanY && p1.y>scanY)){
        const ratio=(scanY-p1.y)/(p2.y-p1.y);
        crossings.push(p1.x+ratio*(p2.x-p1.x));
      }
    }
    crossings.sort((a,b)=>a-b);
    // Pair intersections separately: near the cleft, the heart has two
    // distinct lobes. Keeping them separate preserves the inward notch.
    for(let k=0;k+1<crossings.length;k+=2){
      const left=crossings[k]+5,right=crossings[k+1]-5;
      if(right-left>30)rows.push({y:scanY,left,right});
    }
  }
  return rows;
}
function drawSegment(segment,items){
  const total=items.reduce((sum,item)=>sum+item.width,0)+Math.max(0,items.length-1)*8;
  let x=(segment.left+segment.right-total)/2;
  return items.map(item=>{
    const el=document.createElementNS(ns,'text');
    el.setAttribute('x',x.toFixed(3));
    el.setAttribute('y',segment.y.toFixed(2));
    el.setAttribute('text-anchor','start');
    el.setAttribute('dominant-baseline','middle');
    el.setAttribute('class','word');
    el.textContent=item.phrase;
    svg.appendChild(el);
    x+=item.width+8;
    return el;
  });
}
function buildRows(rows){
  const fontSize=window.innerWidth<520?9.2:10.2;
  const fontStack='"Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Arabic",Arial,sans-serif';
  ctx.font='600 '+fontSize+'px '+fontStack;
  const groups=[];
  rows.forEach(segment=>{
    let group=groups.find(g=>Math.abs(g.y-segment.y)<0.1);
    if(!group){group={y:segment.y,segments:[]};groups.push(group);}
    group.segments.push(segment);
  });
  const result=[];
  groups.forEach(group=>{
    const segments=group.segments.sort((a,b)=>a.left-b.left);
    if(segments.length===2){
      // The two upper lobes receive different phrases, but their total
      // typography width is balanced so neither side looks heavier.
      const bins=[[],[]], widths=[0,0];
      const limits=segments.map(s=>s.right-s.left);
      while(phraseCursor<phrases.length){
        const phrase=phrases[phraseCursor][0];
        const width=ctx.measureText(phrase).width;
        const side=widths[0]<=widths[1]?0:1;
        if(widths[side]+(bins[side].length?8:0)+width>limits[side]){
          const other=1-side;
          if(widths[other]+(bins[other].length?8:0)+width>limits[other])break;
          bins[other].push({phrase,width});
          widths[other]+=width+(bins[other].length>1?8:0);
        }else{
          bins[side].push({phrase,width});
          widths[side]+=width+(bins[side].length>1?8:0);
        }
        phraseCursor++;
      }
      bins.forEach((items,i)=>result.push(...drawSegment(segments[i],items)));
    }else{
      const segment=segments[0],limit=segment.right-segment.left;
      const items=[];let widthUsed=0;
      while(phraseCursor<phrases.length){
        const phrase=phrases[phraseCursor][0],width=ctx.measureText(phrase).width;
        const next=widthUsed+(items.length?8:0)+width;
        if(next>limit)break;
        items.push({phrase,width});widthUsed=next;phraseCursor++;
      }
      result.push(...drawSegment(segment,items));
    }
  });
  return result;
}
function clear(){
  timers.forEach(clearTimeout);timers=[];
  svg.replaceChildren();
}
function render(){
  clear();
  phraseCursor=0;
  const rows=heartRows();
  const elements=buildRows(rows);
  // Reveal the outside contour first, then progressively fill toward the centre.
  const order=elements.map((_,i)=>i).sort((a,b)=>{
    const da=Math.abs(a-(rows.length-1)/2),db=Math.abs(b-(rows.length-1)/2);
    return db-da;
  });
  let sequence=0;
  order.forEach((rowIndex,ring)=>{
    const el=elements[rowIndex];
    {
      const delay=sequence*19 + ring*35;
      const timer=setTimeout(()=>el.classList.add('visible'),delay);
      timers.push(timer);sequence++;
    }
  });
}
document.getElementById('replay').addEventListener('click',render);
document.fonts.ready.then(render);
</script>
</body>
</html>

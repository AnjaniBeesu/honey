<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050303">
<meta name="description" content="I love you, in every language.">
<title>for you ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500&family=Noto+Sans+Devanagari:wght@500&family=Noto+Sans+JP:wght@500&family=Noto+Sans+KR:wght@500&family=Noto+Sans+SC:wght@500&family=Noto+Sans+Telugu:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#ff604f;--bg:#050303}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#160707 0%,#090404 48%,#050303 78%);color:var(--red)}
main{width:min(100vw,760px);height:100svh;min-height:420px;display:grid;place-items:center;position:relative;padding:20px}
.heart-stage{width:min(100%,620px);aspect-ratio:1/1.04;display:grid;place-items:center}
svg{width:100%;height:100%;overflow:visible}
.word{font-family:'Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Arabic',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:var(--red);opacity:0;filter:drop-shadow(0 0 3px #ff493b45)}
.word.visible{animation:appear .32s ease-out forwards}
@keyframes appear{from{opacity:0;filter:blur(2px);transform:translateY(2px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.replay{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #54201c;background:#100706;color:#e77a6d;border-radius:30px;padding:9px 15px;font:9px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.68;cursor:pointer}
.replay:hover{opacity:1;border-color:#b94235}
@media(max-width:520px){main{padding:10px}.heart-stage{width:112%;max-width:none}.word{font-size:9.4px}.replay{bottom:18px}}
@media(prefers-reduced-motion:reduce){.word.visible{animation:none;opacity:1}}
</style>
</head>
<body>
<main>
  <div class="heart-stage">
    <svg id="heart" viewBox="0 0 600 620" role="img" aria-label="A heart filled with I love you in many languages"></svg>
  </div>
  <button class="replay" id="replay" type="button">↻ &nbsp; replay</button>
</main>
<script>
const phrases = [
  ['I love you','en'],['मैं तुमसे प्यार करता हूँ','hi'],['నిన్ను ప్రేమిస్తున్నాను','te'],
  ['Ich liebe dich','de'],['사랑해','ko'],['愛してる','ja'],['我爱你','zh'],
  ['Te amo','es'],['Je t’aime','fr'],['Ti amo','it'],['Я тебя люблю','ru'],
  ['أحبك','ar'],['Eu te amo','pt'],['Mahal kita','tl'],['Seni seviyorum','tr'],
  ['Σ’ αγαπώ','el'],['Kocham cię','pl'],['Ik hou van jou','nl'],['Jeg elsker dig','da'],
  ['Jag älskar dig','sv'],['Nakupenda','sw'],['Volim te','hr'],['愛してるよ','ja'],
  ['நான் உன்னை காதலிக்கிறேன்','ta'],['আমি তোমাকে ভালোবাসি','bn'],['હું તને પ્રેમ કરું છું','gu'],
  ['أحبك كثيراً','ar'],['Te quiero','es'],['Je t’adore','fr'],['Ich hab dich lieb','de'],
  ['사랑합니다','ko'],['我愛你','zh'],['Я люблю тебя','ru'],['Ti voglio bene','it']
];
const svg=document.getElementById('heart');
const ns='http://www.w3.org/2000/svg';
let timers=[];
const sampleCanvas=document.createElement('canvas');
const ctx=sampleCanvas.getContext('2d');
const font='600 10.5px "Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Arabic",Arial,sans-serif';
ctx.font=font;

function inside(x,y){
  return Math.pow(x*x+y*y-1,3)-x*x*y*y*y < 0;
}
function heartRows(){
  const rows=[];
  // The implicit heart equation gives each row its exact silhouette width.
  for(let py=92;py<=526;py+=17.2){
    const ny=(310-py)/218;
    let left=null,right=null;
    for(let nx=-1.28;nx<=1.281;nx+=.004){
      if(inside(nx,ny)){if(left===null)left=nx;right=nx;}
    }
    if(left!==null && right-left>.12){
      rows.push({y:py,left:300+left*218,right:300+right*218});
    }
  }
  return rows;
}
function buildRow(row,rowIndex,allRows){
  const available=row.right-row.left;
  const tokens=[];
  let phraseIndex=(rowIndex*5)%phrases.length;
  let width=0;
  // Repeat phrases at their natural size so every line stays crisp and readable.
  while(width<available && tokens.length<90){
    const phrase=phrases[phraseIndex%phrases.length][0];
    const w=ctx.measureText(phrase).width;
    tokens.push({text:phrase,width:w});
    width+=w+10;
    phraseIndex++;
  }
  if(tokens.length)width-=10;
  while(tokens.length && width>available){
    const removed=tokens.pop();
    width-=removed.width+10;
  }
  const total=width;
  let cursor=300-total/2;
  return tokens.map(t=>{
    const el=document.createElementNS(ns,'text');
    el.setAttribute('x',cursor.toFixed(2));
    el.setAttribute('y',row.y.toFixed(1));
    el.setAttribute('text-anchor','start');
    el.setAttribute('dominant-baseline','middle');
    el.setAttribute('class','word');
    el.textContent=t.text;
    svg.appendChild(el);
    cursor+=t.width+10;
    return el;
  });
}
function clear(){
  timers.forEach(clearTimeout);timers=[];
  svg.replaceChildren();
}
function render(){
  clear();
  const rows=heartRows();
  const rowElements=rows.map((r,i)=>buildRow(r,i,rows));
  // Reveal the outside contour first, then progressively fill toward the centre.
  const order=rows.map((_,i)=>i).sort((a,b)=>{
    const da=Math.abs(a-(rows.length-1)/2),db=Math.abs(b-(rows.length-1)/2);
    return db-da;
  });
  let sequence=0;
  order.forEach((rowIndex,ring)=>{
    const row=rowElements[rowIndex];
    row.forEach((el,j)=>{
      const delay=sequence*19 + ring*35;
      const timer=setTimeout(()=>el.classList.add('visible'),delay);
      timers.push(timer);sequence++;
    });
  });
}
document.getElementById('replay').addEventListener('click',render);
render();
</script>
</body>
</html>

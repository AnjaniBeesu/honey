<style>
:root{color-scheme:dark;--red:#ff6254;--bg:#050303}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#180707 0%,#090404 52%,#050303 80%);color:var(--red)}
main{width:100vw;height:100svh;min-height:420px;display:grid;place-items:center;position:relative;padding:12px}
.heart-stage{width:min(100%,700px);height:min(88svh,700px);display:grid;place-items:center}
svg{width:100%;height:100%;overflow:visible}
.word{text-anchor:middle;dominant-baseline:middle;font-family:"Noto Sans","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Hebrew","Noto Sans Thai","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Armenian","Noto Sans Ethiopic","Noto Sans Georgian","Noto Sans Khmer","Noto Sans Lao","Noto Sans Myanmar","Noto Sans Sinhala",sans-serif;font-size:7.6px;font-weight:500;letter-spacing:0;fill:var(--red);opacity:0}
.word.visible{animation:appear .38s ease-out forwards}
@keyframes appear{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
.replay{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #54201c;background:#100706;color:#e77a6d;border-radius:30px;padding:9px 15px;font:9px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.68;cursor:pointer}
.replay:hover{opacity:1;border-color:#b94235}
@media(max-width:520px){main{padding:5px}.heart-stage{width:100%;height:82svh}.word{font-size:6.8px}.replay{bottom:14px}}
@media(prefers-reduced-motion:reduce){.word.visible{animation:none;opacity:1}}
</style>

<body>

  <button class="replay" id="replay" type="button">↻ &nbsp; replay</button>

<script>

["Szeretlek","Hungarian"],["Ég elska þig","Icelandic"],["A hụrụ m gị n'anya","Igbo"],["Ay-ayaten ka","Ilocano"],
["Aku mencintaimu","Indonesian"],["Ti amo","Italian"],["愛してます","Japanese"],["Мен сені жақсы көремін","Kazakh"],
["ខ្ញុំស្រលាញ់អ្នក","Khmer"],["Ndagukunda","Kinyarwanda"],["사랑해요","Korean"],["Ez hej te dikim","Kurdish"],
["ຂ້ອຍຮັກເຈົ້າ","Lao"],["Te amo","Latin"],["Es mīlu Tevi","Latvian"],["Aš tave myliu","Lithuanian"],

["Ayóó'ánííníshní","Navajo"],["म तिमीलाई माया गर्छु","Nepali"],["Jeg elsker deg","Norwegian"],["زه ستا سره مینه لرم","Pashto"],
["Kocham cię","Polish"],["Te amo","Portuguese"],["ਮੈਂ ਤੁਹਾਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","Punjabi"],["Sin jaalladha","Oromo"],
["Kuyaykim","Quechua"],["Te iubesc","Romanian"],["Я тебя люблю","Russian"],["Oute alofa ia oe","Samoan"],
["Ke a go rata","Sepedi"],["Волим те","Serbian"],["Kea u rata","Sesotho"],["Ľúbim ťa","Slovak"],
["Ljubim te","Slovenian"],["Waan ku jeclahay","Somali"],["Te amo","Spanish"],["Nakupenda","Swahili"],
["Jag älskar dig","Swedish"],["Ua here vau ia oe","Tahitian"],["நான் உன்னை நேசிக்கிறேன்","Tamil"],["నేను నిన్ను ప్రేమిస్తున్నాను","Telugu"],
["ฉันรักคุณ","Thai"],["ང་ཁྱོད་ལ་དགའ།","Tibetan"],["ʻOku ou 'ofa au 'ia koe","Tongan"],["Ndza ku rhandza","Tsonga"],
["Seni seviyorum","Turkish"],["я тебе люблю","Ukrainian"],["Men sizni sevaman","Uzbek"],["Tôi yêu bạn","Vietnamese"],

["ང་ཁྱོད་ལུ་ག་དགའི་ཡོད","Dzongkha"],["Eg elski teg","Faroese"],["Ik hâld fan dy","Frisian"],["Asavakkit","Greenlandic"],
["હું તને પ્રેમ કરું છું","Gujarati"],["ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","Kannada"],["तुजो मोग म्हाका जाय","Konkani"],["ഞാൻ നിന്നെ പ്രേമിക്കുന്നു","Malayalam"],
["मी तुझ्यावर प्रेम करतो","Marathi"],["ମୁଁ ତୁମକୁ ଭଲ ପାଉଛି","Odia"],["مان توکي پيار ڪندو آهيان","Sindhi"],["මම ඔයාට ආදරෙයි","Sinhala"],
["Abdi bogoh ka anjeun","Sundanese"]
,["Сэ шІу усэлъэгъу","Adyghe"],["Txin yaxtakuq","Aleut"],["Ich hàbb dir lïab","Alsatian"],["Мен сени сӱӱп jадым","Altay"],["T'aimo","Aragonese"],["Biixoo3é3en","Arapaho"],["Ti voi","Aromanian"],["Quiérote","Asturian"],["Ki micta sakihitin","Atikamekw"],["Titiyang tresna sareng ragane","Balinese"],["M'bi fe","Bambara"],["мин һине яратам","Bashkir"],["I liab di","Bavarian"],["Nalikutemwa","Bemba"],["Namumùtan taka","Bikol"],["Bong nawa ta gè","Blaan"],["Karout a ran ac'hanout","Breton"],["Nta amabo","Cape Verdean Creole"],["Go-nóhkwa’","Cayuga"],["Oupus oku diya","Central Dusun"],["Ta ama yo cuntigo","Chabacano"],["Ai ranam dai","Cham (Western)"],["Hu guiaya hao","Chamorro"],["Суна хьо дукха веза","Chechen"],["ᎬᎨᏳᎢ","Cherokee"],["Nemehotȧtse","Cheyenne"],["من دوستت دارم","Dari"],["Ina son ki","Hausa"],["Kulo tresno kaliyan njenengan","Javanese"],["Мен сени сүйөм","Kyrgyz"]
];

const svg=document.getElementById("heart");
const NS="http://www.w3.org/2000/svg";
let timers=[];
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

function heartSegments(){
  // The silhouette is derived directly from the requested implicit equation:
  // (x² + y² - 1)³ - x²y³ = 0.  Points satisfying f(x,y) <= 0
  // are inside the heart.  Each scanline is found from its zero crossings.
  const scale=232,cx=300,cy=306,rows=[];
  const equation=(x,y)=>Math.pow(x*x+y*y-1,3)-x*x*y*y*y;
  for(let mathY=0.985;mathY>=-1.005;mathY-=0.026){
    const hits=[];
    const steps=1800,lo=-1.18,hi=1.18,dx=(hi-lo)/steps;
    let px=lo,pv=equation(px,mathY);
    for(let i=1;i<=steps;i++){
      const x=lo+i*dx,v=equation(x,mathY);
      if((pv<=0&&v>0)||(pv>0&&v<=0)){
        const t=pv/(pv-v);
        hits.push(px+(x-px)*t);
      }
      px=x;pv=v;
    }
    if(hits.length>=2){
      // Pair the crossings and keep only genuinely interior spans.
      for(let i=0;i+1<hits.length;i+=2){
        const left=cx+hits[i]*scale+1.5,right=cx+hits[i+1]*scale-1.5;
        if(right-left>4)rows.push({y:cy-mathY*scale,left,right});
      }
    }
  }
  return rows;
}
function fontFor(text,size){
  // Script-specific families are listed first where applicable; Noto Sans is the Latin fallback.
  let family='"Noto Sans",sans-serif';
  if(/[\u0600-\u06ff\u0750-\u077f]/.test(text))family='"Noto Sans Arabic",'+family;
  else if(/[\u0900-\u097f]/.test(text))family='"Noto Sans Devanagari",'+family;
  else if(/[\u0980-\u09ff]/.test(text))family='"Noto Sans Bengali",'+family;
  else if(/[\u0c00-\u0c7f]/.test(text))family='"Noto Sans Telugu",'+family;
  else if(/[\u0b80-\u0bff]/.test(text))family='"Noto Sans Tamil",'+family;
  else if(/[\u0e00-\u0e7f]/.test(text))family='"Noto Sans Thai",'+family;
  else if(/[\u3040-\u30ff]/.test(text))family='"Noto Sans JP",'+family;
  else if(/[\uac00-\ud7af]/.test(text))family='"Noto Sans KR",'+family;
  else if(/[\u4e00-\u9fff]/.test(text))family='"Noto Sans SC",'+family;
  else if(/[\u0590-\u05ff]/.test(text))family='"Noto Sans Hebrew",'+family;
  else if(/[\u0530-\u058f]/.test(text))family='"Noto Sans Armenian",'+family;
  else if(/[\u10a0-\u10ff]/.test(text))family='"Noto Sans Georgian",'+family;
  else if(/[\u1200-\u137f]/.test(text))family='"Noto Sans Ethiopic",'+family;
  else if(/[\u1780-\u17ff]/.test(text))family='"Noto Sans Khmer",'+family;
  else if(/[\u0e80-\u0eff]/.test(text))family='"Noto Sans Lao",'+family;
  else if(/[\u1000-\u109f]/.test(text))family='"Noto Sans Myanmar",'+family;
  else if(/[\u0d00-\u0d7f]/.test(text))family='"Noto Sans Malayalam",'+family;
  else if(/[\u0c80-\u0cff]/.test(text))family='"Noto Sans Kannada",'+family;
  else if(/[\u0a00-\u0a7f]/.test(text))family='"Noto Sans Gurmukhi",'+family;
  else if(/[\u0b00-\u0b7f]/.test(text))family='"Noto Sans Oriya",'+family;
  else if(/[\u0d80-\u0dff]/.test(text))family='"Noto Sans Sinhala",'+family;
  ctx.font=size+'px '+family;
  return family;
}
function layout(){
  svg.replaceChildren();
  const mobile=window.matchMedia("(max-width:520px)").matches;
  const baseSize=mobile?6.4:7.1;
  const gap=mobile?5.2:6.2;
  const rows=heartSegments();
  const remaining=phrases.map(([phrase,language],index)=>({phrase,language,index}));
  const placements=[];
  // Pack each row independently. A phrase is committed only after its measured
  // width plus the mandatory gap fits, so no fallback can overwrite another.
  for(const row of rows){
    if(!remaining.length)break;
    const available=row.right-row.left;
    let cursor=row.left;
    const rowItems=[];
    while(remaining.length){
      const room=row.right-cursor-(rowItems.length?gap:0);
      if(room<=0)break;
      let chosen=-1,chosenWidth=Infinity,chosenFamily="",chosenSize=baseSize;
      for(let i=0;i<remaining.length;i++){
        const family=fontFor(remaining[i].phrase,baseSize);
        const width=ctx.measureText(remaining[i].phrase).width;
        if(width<=room && width<chosenWidth){
          chosen=i;chosenWidth=width;chosenFamily=family;
        }
      }
      // Narrow rows near the lobes/tip may use a smaller phrase, but never
      // below 3.5px and never beyond the row's actual interior boundaries.
      if(chosen<0&&!rowItems.length&&available>=8){
        let shortest=-1,shortestWidth=Infinity,shortestFamily="";
        for(let i=0;i<remaining.length;i++){
          const family=fontFor(remaining[i].phrase,baseSize);
          const width=ctx.measureText(remaining[i].phrase).width;
          if(width<shortestWidth){shortest=i;shortestWidth=width;shortestFamily=family;}
        }
        const fit=baseSize*Math.min(1,(available-2)/shortestWidth);
        if(fit>=3.5){
          fontFor(remaining[shortest].phrase,fit);
          chosen=shortest;chosenWidth=ctx.measureText(remaining[shortest].phrase).width;
          chosenFamily=shortestFamily;chosenSize=fit;
        }
      }
      if(chosen<0)break;
      const item=remaining.splice(chosen,1)[0];
      rowItems.push({item,width:chosenWidth,family:chosenFamily,size:chosenSize});
      cursor+=chosenWidth+(rowItems.length>1?gap:0);
    }
    if(!rowItems.length)continue;
    const total=rowItems.reduce((s,p)=>s+p.width,0)+gap*(rowItems.length-1);
    let x=(row.left+row.right-total)/2;
    for(const p of rowItems){
      const el=document.createElementNS(NS,"text");
      el.setAttribute("x",(x+p.width/2).toFixed(2));
      el.setAttribute("y",row.y.toFixed(2));
      el.setAttribute("class","word");
      el.setAttribute("font-family",p.family);
      el.style.fontSize=p.size+"px";
      el.textContent=p.item.phrase;
      svg.appendChild(el);
      placements.push({el,y:row.y,x:x+p.width/2});
      x+=p.width+gap;
    }
  }
  // Deliberately do not force leftover phrases into occupied rows: that would
  // violate the no-overlap requirement. Report any capacity issue in console.
  if(remaining.length)console.warn("Heart layout could not fit every phrase without overlap:",remaining.map(p=>p.language));
  const centerY=306;
  placements.sort((a,b)=>Math.abs(b.y-centerY)-Math.abs(a.y-centerY)||a.x-b.x);
  placements.forEach((p,i)=>{
    const timer=setTimeout(()=>p.el.classList.add("visible"),i*18);
    timers.push(timer);
  });
}
function render(){
  timers.forEach(clearTimeout);timers=[];
  // Restore the original order before each layout/replay.
  layout();
}
document.getElementById("replay").addEventListener("click",render);
document.fonts.ready.then(render);
window.addEventListener("resize",()=>{clearTimeout(window.__heartResize);window.__heartResize=setTimeout(render,180)});
</script>

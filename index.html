<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you, in every language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff8f7; --bg2:#ffe0e4; --red:#e0183f; --red2:#a80019; --tint:rgba(224,24,63,.07); --glow:rgba(224,24,63,.16);
  --muted:#a8434f; --btn-bg:#d90429; --btn-fg:#fff; --btn-ring:rgba(217,4,41,.3);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#220b11; --bg2:#0b0406; --red:#ff6b7d; --red2:#ff2a44; --tint:rgba(255,59,82,.09); --glow:rgba(255,59,82,.22);
    --muted:#c98089; --btn-bg:#ff3b52; --btn-fg:#1a0509; --btn-ring:rgba(255,59,82,.38);
  }
}
:root[data-theme="dark"]{
  --bg1:#220b11; --bg2:#0b0406; --red:#ff6b7d; --red2:#ff2a44; --tint:rgba(255,59,82,.09); --glow:rgba(255,59,82,.22);
  --muted:#c98089; --btn-bg:#ff3b52; --btn-fg:#1a0509; --btn-ring:rgba(255,59,82,.38);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:16px 12px 24px; overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 40%, var(--bg1), var(--bg2) 78%) var(--bg2);
  font-family:'Quicksand','Noto Sans','Segoe UI',system-ui,-apple-system,'Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Thai','Noto Sans CJK SC',sans-serif;
  font-weight:500; color:var(--red);
}
.stage{position:relative; line-height:1}
.wrap{position:relative}
.wrap::before{content:""; position:absolute; inset:-8%; border-radius:50%; background:radial-gradient(circle, var(--glow), transparent 65%); pointer-events:none}
.w{
  position:absolute; left:0; top:0; white-space:nowrap; line-height:1;
  color:var(--red); color:color-mix(in srgb,var(--red) calc((1 - var(--t,0))*100%),var(--red2));
  opacity:0; filter:blur(3px);
  transform:translate(var(--x),var(--y)) scale(.55);
  transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1.3), filter .6s ease;
}
.w.show{opacity:var(--o,1); filter:blur(0); transform:translate(var(--x),var(--y)) scale(1)}
.w.glow{animation:glow 2.4s ease-in-out}
@keyframes glow{
  0%,100%{text-shadow:0 0 0 transparent; transform:translate(var(--x),var(--y)) scale(1)}
  45%{opacity:1; text-shadow:0 0 6px currentColor,0 0 16px currentColor,0 0 30px currentColor; transform:translate(var(--x),var(--y)) scale(1.16)}
}
.dedication{position:fixed; top:22px; left:26px; z-index:5; font-family:'Special Elite',monospace; font-size:clamp(17px,2.2vw,23px); color:var(--red); letter-spacing:.02em; transform:rotate(-3deg); opacity:.9}
.cap{min-height:3.4em; font-size:15px; letter-spacing:.02em; color:var(--muted); text-align:center; line-height:1.65}
.cap .reveal-line{display:block; opacity:0; transform:translateY(7px); animation:lineIn .8s ease forwards}
.cap .reveal-line.final{font-size:18px; color:var(--red); font-weight:600; animation-delay:.25s}
@keyframes lineIn{to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.dedication{top:16px;left:15px;font-size:17px}}
button{
  font:inherit; font-weight:600; font-size:15px; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 28px; border:0; border-radius:999px;
  background:var(--btn-bg); color:var(--btn-fg);
  box-shadow:0 6px 18px -6px var(--btn-ring);
  transition:transform .15s ease, box-shadow .15s ease;
}
button:hover{transform:translateY(-1px); box-shadow:0 10px 22px -6px var(--btn-ring)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--red); outline-offset:3px}
button svg{width:16px;height:16px;transition:transform .5s ease}
button:hover svg{transform:rotate(-200deg)}
@media (prefers-reduced-motion: reduce){ .w{transition:none; filter:none} .w.glow{animation:none} }
</style>
</head>
<body>
<div class="dedication">for my darling</div>
<div class="wrap"><div class="stage" id="stage" aria-label="A heart made of the words I love you in many languages"></div></div>
<div class="cap" id="cap" aria-live="polite"></div>
<button id="replay" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  Replay
</button>

<script>
const PH=[
["English","I love you"],["Hindi","मैं तुमसे प्यार करता हूँ"],["Telugu","నేను నిన్ను ప్రేమిస్తున్నాను"],["German","Ich liebe dich"],
["Korean","사랑해"],["Japanese","愛してる"],["Chinese","我爱你"],["French","Je t’aime"],["Spanish","Te amo"],["Italian","Ti amo"],
["Arabic","أنا أحبكِ"],["Hebrew","אני אוהב אותך"],["Vietnamese","Anh yêu em"],["Thai","ผมรักคุณ"],["Turkish","Seni seviyorum"],
["Russian","Я тебя люблю"],["Portuguese","Eu te amo"],["Dutch","Ik hou van jou"],["Swedish","Jag älskar dig"],["Polish","Kocham cię"],
["Greek","Σ’ αγαπώ"],["Czech","Miluji tě"],["Danish","Jeg elsker dig"],["Finnish","Minä rakastan sinua"],["Norwegian","Jeg elsker deg"],
["Hungarian","Szeretlek"],["Romanian","Te iubesc"],["Ukrainian","Я тебе кохаю"],["Indonesian","Aku cinta kamu"],["Filipino","Mahal kita"],
["Swahili","Ninakupenda"],["Afrikaans","Ek het jou lief"],["Albanian","Te dua"],["Armenian","Ես քեզ սիրում եմ"],["Bengali","আমি তোমাকে ভালোবাসি"],
["Bulgarian","Обичам те"],["Croatian","Volim te"],["Serbian","Волим те"],["Catalan","T’estimo"],["Hawaiian","Aloha au ia ʻoe"],
["Tamil","நான் உன்னை காதலிக்கிறேன்"],["Kannada","ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ"],["Malayalam","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു"],
["Marathi","मी तुझ्यावर प्रेम करतो"],["Gujarati","હું તને પ્રેમ કરું છું"],["Punjabi","ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ"],["Urdu","میں تم سے محبت کرتا ہوں"],
["Nepali","म तिमीलाई माया गर्छु"],["Persian","دوستت دارم"],["Malay","Saya cintakan awak"],["Icelandic","Ég elska þig"],
["Irish","Tá grá agam duit"],["Welsh","Dw i’n dy garu di"],["Latvian","Es tevi mīlu"],["Lithuanian","Aš tave myliu"],["Estonian","Ma armastan sind"],
["Slovak","Milujem ťa"],["Slovenian","Ljubim te"],["Macedonian","Те сакам"],["Georgian","მიყვარხარ"],["Maltese","Inħobbok"],
["Zulu","Ngiyakuthanda"],["Amharic","እወድሻለሁ"],["Esperanto","Mi amas vin"],["Basque","Maite zaitut"],["Galician","Quérote"],
["Mongolian","Би чамд хайртай"],["Khmer","ខ្ញុំស្រលាញ់អ្នក"],["Lao","ຂ້ອຍຮັກເຈົ້າ"],["Sinhala","මම ඔබට ආදරෙයි"],["Maori","Aroha atu"],
["Samoan","Ou te alofa ia te oe"],["Kazakh","Мен сені сүйемін"],["Azerbaijani","Səni sevirəm"],
["Cebuano","Gihigugma ka nako"],["Haitian Creole","Mwen renmen w"],["Uzbek","Seni sevaman"],["Kyrgyz","Мен сени сүйөм"],
["Tajik","Туро дўст медорам"],["Pashto","زه تا سره مینه کوم"],["Kurdish","Hez te dikim"],["Somali","Waan ku jeclahay"],
["Hausa","Ina son ka"],["Igbo","Enwere m gị n’anya"],["Shona","Ndinokuda"],["Xhosa","Ndiyakuthanda"],
["Kinyarwanda","Ndagukunda"],["Malagasy","Tiako ianao"],["Luxembourgish","Ech hunn dech gäere"],["Frisian","Ik hâld fan dy"],
["Scottish Gaelic","Tha gaol agam ort"],["Faroese","Eg elski teg"],["Belarusian","Я цябе кахаю"],["Odia","ମୁଁ ତୁମକୁ ଭଲ ପାଏ"],
["Assamese","মই তোমাক ভাল পাওঁ"],["Cantonese","我愛你"],["Tongan","ʻOku ou ʻofa ʻia koe"],["Fijian","Au domoni iko"],
["Tahitian","Ua here vau ia oe"],["Yiddish","איך האב דיך ליב"],["Quechua","Munakuyki"],["Guarani","Rohayhu"],
["Yoruba","Mo nífẹ̀ẹ́ rẹ"],["Tibetan","ངས་ཁྱེད་ལ་བརྩེ་དུང་ཡོད"]
];

const stage=document.getElementById('stage'), cap=document.getElementById('cap'), btn=document.getElementById('replay');
let timers=[], glowT=null, spans=[], order=[], items=[], glyphEls=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function mk(text,x,y,t,o,extra){
  const e=document.createElement('span');
  e.className='w'; e.dir='auto'; e.textContent=text;
  e.style.setProperty('--x',x.toFixed(2)+'px'); e.style.setProperty('--y',y.toFixed(2)+'px');
  e.style.setProperty('--t',t.toFixed(3)); e.style.setProperty('--o',o);
  if(extra) e.style.fontSize=extra;
  stage.appendChild(e); return e;
}

function build(){
  clearTimers();
  stage.innerHTML=''; items=[]; spans=[]; glyphEls=[];
  const vw=document.documentElement.clientWidth, vh=innerHeight;
  const W=Math.max(260, Math.min(vw*0.95, 700, (vh-160)*1.1));

  const pts=[];
  for(let i=0;i<=720;i++){
    const t=i/720*2*Math.PI;
    pts.push([16*Math.pow(Math.sin(t),3), -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]);
  }
  let minY=1e9,maxY=-1e9,maxX=0;
  for(const [x,y] of pts){ if(y<minY)minY=y; if(y>maxY)maxY=y; if(Math.abs(x)>maxX)maxX=Math.abs(x); }
  const s=W/(2*maxX), H=(maxY-minY)*s;
  stage.style.width=W+'px'; stage.style.height=H+'px';
  const P=pts.map(([x,y])=>[W/2+x*s,(y-minY)*s]);

  const fs=Math.max(8.5,W/44), rowH0=fs*1.42, tip=fs*2.1;
  stage.style.fontSize=fs+'px';


  const meas=(t,fsz)=>{
    const e=document.createElement('span'); e.className='w'; e.style.visibility='hidden';
    if(fsz) e.style.fontSize=fsz; e.textContent=t; stage.appendChild(e);
    const w=e.offsetWidth; e.remove(); return w;
  };
  const wm=PH.map(([,t])=>meas(t));
  const minW=Math.min(...wm);
  const FILL=['you','\u2665\uFE0E','u','\u2665\uFE0E'], fw=FILL.map(t=>meas(t));
  let lastFill=-1;

  const ivs=y=>{
    const xs=[];
    for(let i=0;i<P.length-1;i++){
      const [x1,y1]=P[i],[x2,y2]=P[i+1];
      if((y1<=y&&y2>y)||(y2<=y&&y1>y)) xs.push(x1+(y-y1)/(y2-y1)*(x2-x1));
    }
    xs.sort((a,b)=>a-b);
    const r=[]; for(let i=0;i+1<xs.length;i+=2) r.push([xs[i],xs[i+1]]);
    return r;
  };

  const nR=Math.max(6,Math.floor((H-tip)/rowH0)), rowH=(H-tip)/nR, h=rowH*0.42;
  const pad=fs*0.3, minGap=fs*1.0, maxGap=fs*2.2, cx=W/2;
  let forced=[0,1,2,3,4], lastCenter=-1;
  let pool=shuffle(PH.map((_,i)=>i).filter(i=>i>4));

  const pick=(rem,count)=>{
    while(forced.length){
      const f=forced[0], need0=wm[f]+(count?minGap:0);
      if(need0<=rem) return forced.shift();
      if(count) return -1;
      forced.shift();
    }
    if(pool.length<24) pool.push(...shuffle(PH.map((_,i)=>i)));
    let best=-1,bl=1e9;
    const lim=Math.min(pool.length,18);
    for(let i=0;i<lim;i++){
      const need=wm[pool[i]]+(count?minGap:0);
      if(need<=rem){
        if(rem>fs*16){ best=i; break; }
        if(rem-need<bl){ bl=rem-need; best=i; }
      }
    }
    return best<0?-1:pool.splice(best,1)[0];
  };

  for(let r=0;r<nR;r++){
    const y=(r+.5)*rowH;
    let a=-1e9,b=1e9,ok=true;
    for(const yy of [y-h,y,y+h]){
      const iv=ivs(yy); if(!iv.length){ ok=false; break; }
      a=Math.max(a,iv[0][0]); b=Math.min(b,iv[0][1]);
    }
    if(!ok) continue;
    a+=pad; b-=pad;
    if(b<=a) continue;
    let fi=-1;
    if(b>cx){ do{ fi=Math.floor(Math.random()*FILL.length); }while(lastFill>=0&&FILL[fi]===FILL[lastFill]); lastFill=fi; }
    const fw_=fi>=0?fw[fi]:0, hb=Math.min(b,cx-(fi>=0?fw_/2+minGap*0.8:minGap/2)), avail=hb-a;

    if(avail>=minW){
      if(fi>=0) items.push({text:FILL[fi],lang:null,x:cx-fw_/2,mx:null,y:y-fs/2,t:y/H});
      // left half; the right half is its exact mirror
      const row=[]; let sum=0;
      for(let g=0;g<40;g++){
        const used=sum+minGap*Math.max(0,row.length-1)*(row.length?1:0);
        const idx=pick(avail-used,row.length);
        if(idx<0) break;
        row.push(idx); sum+=wm[idx];
      }
      if(!row.length) continue;
      let gap=row.length>1?(avail-sum)/(row.length-1):0;
      gap=Math.min(gap,maxGap);
      const total=sum+gap*(row.length-1);
      let x=a+(avail-total)/2;
      for(const idx of row){
        items.push({text:PH[idx][1],lang:PH[idx][0],x,mx:W-x-wm[idx],y:y-fs/2,t:y/H});
        x+=wm[idx]+gap;
      }
    } else if(b>cx){
      // narrow row near the tip: one word centred on the axis
      const full=2*(cx-a);
      const fit=PH.map((_,i)=>i).filter(i=>wm[i]<=full&&i!==lastCenter);
      if(!fit.length) continue;
      const mw=Math.max(...fit.map(i=>wm[i]));
      const c=fit.filter(i=>wm[i]>=mw*0.6);
      const idx=c[Math.floor(Math.random()*c.length)];
      lastCenter=idx;
      items.push({text:PH[idx][1],lang:PH[idx][0],x:cx-wm[idx]/2,mx:null,y:y-fs/2,t:y/H});
    }
  }

  // words
  items.forEach(it=>{
    const o=(0.74+Math.random()*0.26).toFixed(2), pair=[];
    pair.push(mk(it.text,it.x,it.y,it.t,o));
    if(it.mx!=null) pair.push(mk(it.text,it.mx,it.y,it.t,o));
    spans.push(pair);
  });
  // heart glyph at the very tip
  const gs=fs*1.35, gtxt='\u2665\uFE0E', gw=meas(gtxt,gs+'px');
  glyphEls=[mk(gtxt,cx-gw/2,H-fs*1.15-gs/2,1,1,gs+'px')];

  order=shuffle(spans.map((_,i)=>i));
  play();
}

function clearTimers(){ timers.forEach(clearTimeout); timers=[]; clearTimeout(glowT); }

function glowLoop(){
  const all=spans.flat().concat(glyphEls);
  const e=all[Math.floor(Math.random()*all.length)];
  e.classList.add('glow');
  glowT=setTimeout(()=>{
    e.classList.remove('glow');
    glowT=setTimeout(glowLoop,300+Math.random()*500);
  },2400);
}

function finish(){
  const count=new Set(items.map(i=>i.lang).filter(Boolean)).size;
  cap.innerHTML='<span>'+count+' ways to say I love you</span>';
  timers.push(setTimeout(()=>{
    cap.innerHTML='<span>'+count+' ways to say I love you</span><span class="reveal-line">and i want to say it to my favorite person</span>';
    timers.push(setTimeout(()=>{
      cap.innerHTML='<span>'+count+' ways to say I love you</span><span class="reveal-line">and i want to say it to my favorite person</span><span class="reveal-line final">its you darling ♡</span>';
    },1800));
  },1800));
  if(!reduce) glowLoop();
}

function play(){
  clearTimers();
  [...spans.flat(),...glyphEls].forEach(e=>e.classList.remove('show','glow'));
  cap.textContent='';
  const N=spans.length;
  if(reduce){ [...spans.flat(),...glyphEls].forEach(e=>e.classList.add('show')); finish(); return; }
  const total=Math.min(9000,Math.max(5000,N*80));
  order.forEach((si,i)=>{
    const d=350+total*Math.pow(i/N,0.85);
    timers.push(setTimeout(()=>{
      spans[si].forEach(e=>e.classList.add('show'));
      if(items[si].lang) cap.textContent=items[si].lang;
    },d));
  });
  timers.push(setTimeout(()=>glyphEls.forEach(e=>e.classList.add('show')),350+total+250));
  timers.push(setTimeout(finish,350+total+1100));
}

btn.addEventListener('click',play);
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(build,250); });
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(build);
</script>
</body>
</html>

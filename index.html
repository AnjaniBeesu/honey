<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050303">
<meta name="description" content="I love you, in every language.">
<title>for you ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500&family=Noto+Sans+Devanagari:wght@500&family=Noto+Sans+JP:wght@500&family=Noto+Sans+KR:wght@500&family=Noto+Sans+SC:wght@500&family=Noto+Sans+Telugu:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#ff604f;--bg:#050303}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#160707 0%,#090404 48%,#050303 78%);color:var(--red)}
main{width:min(100vw,760px);height:100svh;min-height:420px;display:grid;place-items:center;position:relative;padding:20px}
.heart-stage{width:min(100%,620px);aspect-ratio:1/1.04;display:grid;place-items:center}
svg{width:100%;height:100%;overflow:visible}
.word{text-anchor:middle;font-family:'Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Arabic',Arial,sans-serif;font-size:9.6px;font-weight:500;fill:var(--red);opacity:0;filter:drop-shadow(0 0 3px #ff493b45)}
.word.visible{animation:appear .32s ease-out forwards}
@keyframes appear{from{opacity:0;filter:blur(2px);transform:translateY(2px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
.replay{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #54201c;background:#100706;color:#e77a6d;border-radius:30px;padding:9px 15px;font:9px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.68;cursor:pointer}
.replay:hover{opacity:1;border-color:#b94235}
@media(max-width:520px){main{padding:10px}.heart-stage{width:112%;max-width:none}.word{font-size:10px}.replay{bottom:18px}}
@media(prefers-reduced-motion:reduce){.word.visible{animation:none;opacity:1}}
</style>
</head>
<body>
<main>
  <div class="heart-stage">
    <svg id="heart" viewBox="0 0 600 620" role="img" aria-label="A heart filled with I love you in many languages"></svg>
  </div>
  <button class="replay" id="replay" type="button">↻ &nbsp; replay</button>
</main>
<script>
const phrases = [
['I love you','English'],['मैं तुमसे प्यार करता हूँ','Hindi'],['నేను నిన్ను ప్రేమిస్తున్నాను','Telugu'],
['Ich liebe dich','German'],['사랑해','Korean'],['愛してる','Japanese'],['我爱你','Chinese'],
["Je t'aime",'French'],['Te amo','Spanish'],['Ti amo','Italian'],['أنا أحبكِ','Arabic'],
['אני אוהב אותך','Hebrew'],['Anh yêu em','Vietnamese'],['ผมรักคุณ','Thai'],['Seni seviyorum','Turkish'],
['Я тебя люблю','Russian'],['Eu te amo','Portuguese'],['Ik hou van jou','Dutch'],['Jag älskar dig','Swedish'],
['Kocham cię','Polish'],["Σ' αγαπώ",'Greek'],['Miluji tě','Czech'],['Jeg elsker dig','Danish'],
['Minä rakastan sinua','Finnish'],['Jeg elsker deg','Norwegian'],['Szeretlek','Hungarian'],['Te iubesc','Romanian'],
['Я тебе кохаю','Ukrainian'],['Aku cinta kamu','Indonesian'],['Mahal kita','Filipino'],['Ninakupenda','Swahili'],
['Ek het jou lief','Afrikaans'],['Te dua','Albanian'],['Ես քեզ սիրում եմ','Armenian'],
['আমি তোমাকে ভালোবাসি','Bengali'],['Обичам те','Bulgarian'],['Volim te','Croatian'],['Волим те','Serbian'],
["T'estimo",'Catalan'],['Aloha au ia ʻoe','Hawaiian']
];
const svg=document.getElementById('heart');
const ns='http://www.w3.org/2000/svg';
let timers=[];
let phraseCursor=0;
const sampleCanvas=document.createElement('canvas');
const ctx=sampleCanvas.getContext('2d');
const font='600 10.2px "Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Arabic",Arial,sans-serif';
ctx.font=font;

// Sample a mathematically defined heart outline, then calculate the exact
// left/right edge at every text baseline. No visible guides or coordinate marks.
function heartRows(){
  const outline=[];
  const scale=13.0, cx=300, cy=310;
  for(let i=0;i<=1200;i++){
    const t=(i/1200)*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    outline.push({x:cx+scale*x,y:cy-scale*y});
  }
  const minY=Math.min(...outline.map(p=>p.y));
  const maxY=Math.max(...outline.map(p=>p.y));
  const rows=[];
  for(let scanY=minY+7;scanY<maxY-5;scanY+=15.5){
    const crossings=[];
    for(let i=0;i<outline.length-1;i++){
      const p1=outline[i],p2=outline[i+1];
      if((p1.y<=scanY && p2.y>scanY)||(p2.y<=scanY && p1.y>scanY)){
        const ratio=(scanY-p1.y)/(p2.y-p1.y);
        crossings.push(p1.x+ratio*(p2.x-p1.x));
      }
    }
    crossings.sort((a,b)=>a-b);
    // Pair intersections separately: near the cleft, the heart has two
    // distinct lobes. Keeping them separate preserves the inward notch.
    for(let k=0;k+1<crossings.length;k+=2){
      const left=crossings[k]+5,right=crossings[k+1]-5;
      if(right-left>30)rows.push({y:scanY,left,right});
    }
  }
  return rows;
}
function measurePhrase(text){
  return ctx.measureText(text).width;
}
function buildRows(rows){
  const fontSize=window.innerWidth<520?8.4:9.6;
  const fontStack='"Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Arabic",Arial,sans-serif';
  ctx.font='500 '+fontSize+'px '+fontStack;
  const segments=rows.slice().sort((a,b)=>a.y-b.y || a.left-b.left);
  const placements=[];
  let index=0;
  // Put one unique phrase in each available slice. If a phrase is too wide
  // for a narrow slice, keep it for the next wider slice; never duplicate it.
  segments.forEach((segment)=>{
    if(index>=phrases.length)return;
    const maxWidth=segment.right-segment.left;
    const item=phrases[index];
    const width=measurePhrase(item[0]);
    if(width>maxWidth)return;
    placements.push({segment,phrase:item[0],width});
    index++;
  });
  // Use any remaining phrases in the widest unused slices, still exactly once.
  const used=new Set(placements.map(p=>p.segment));
  const remaining=segments.filter(s=>!used.has(s)).sort((a,b)=>(b.right-b.left)-(a.right-a.left));
  remaining.forEach(segment=>{
    if(index>=phrases.length)return;
    const item=phrases[index],width=measurePhrase(item[0]);
    if(width<=segment.right-segment.left){
      placements.push({segment,phrase:item[0],width});index++;
    }
  });
  return placements.map(({segment,phrase,width})=>{
    const el=document.createElementNS(ns,'text');
    el.setAttribute('x',((segment.left+segment.right)/2).toFixed(3));
    el.setAttribute('y',segment.y.toFixed(2));
    el.setAttribute('text-anchor','middle');
    el.setAttribute('dominant-baseline','middle');
    el.setAttribute('class','word');
    el.textContent=phrase;
    svg.appendChild(el);
    return el;
  });
}
function clear(){
  timers.forEach(clearTimeout);timers=[];
  svg.replaceChildren();
}
function render(){
  clear();
  phraseCursor=0;
  const rows=heartRows();
  const elements=buildRows(rows);
  // Reveal the outside contour first, then progressively fill toward the centre.
  const order=elements.map((_,i)=>i).sort((a,b)=>{
    const da=Math.abs(parseFloat(elements[a].getAttribute('y'))-310),db=Math.abs(parseFloat(elements[b].getAttribute('y'))-310);
    return db-da;
  });
  let sequence=0;
  order.forEach((rowIndex,ring)=>{
    const el=elements[rowIndex];
    {
      const delay=sequence*19 + ring*35;
      const timer=setTimeout(()=>el.classList.add('visible'),delay);
      timers.push(timer);sequence++;
    }
  });
}
document.getElementById('replay').addEventListener('click',render);
document.fonts.ready.then(render);
</script>
</body>
</html>
